<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){
    var t;
    try{t=localStorage.getItem('theme')}catch(e){}
    var mq=window.matchMedia('(prefers-color-scheme: dark)');
    if(t!=='light'&&t!=='dark'){t=mq.matches?'dark':'light'}
    document.documentElement.setAttribute('data-theme',t);
    mq.addEventListener('change',function(e){
      try{if(localStorage.getItem('theme'))return}catch(err){}
      document.documentElement.setAttribute('data-theme',e.matches?'dark':'light');
    });
  })();
</script>
<title>{% if page.title %}{{ page.title }} · {{ site.data.site.name }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.summary | default: site.description }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.data.site.name }} — Applied AI">
<meta property="og:title" content="{% if page.title %}{{ page.title }} · {{ site.data.site.name }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{{ page.summary | default: site.description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/assets/img/og-card.png' | absolute_url }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{% if page.title %}{{ page.title }} · {{ site.data.site.name }}{% else %}{{ site.title }}{% endif %}">
