title: Nathan Phillips — Data Science & Gen AI
description: >-
  Data science and gen AI — three gen-AI systems live on AWS, each with evals in CI,
  guardrails between the model and the data, per-request traces and cost caps.
url: "https://nmp-dsci.github.io"
baseurl: ""

collections:
  projects:
    output: true
    permalink: /projects/:name/
  practices:
    output: true
    permalink: /practices/:name/
  # Deep pages: one system's setup in full, maintained every cycle, reached only
  # from its case study's "go deep" link. The file path is the URL:
  # _deep/<project-slug>/<name>.md → /projects/<project-slug>/<name>/
  deep:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: practices
    values:
      layout: practice
  - scope:
      path: ""
      type: deep
    values:
      layout: deep

markdown: kramdown

exclude:
  # tooling — not part of the published site
  - node_modules
  - vendor
  - .lavish
  - .claude
  - _templates
  - scripts
  - Gemfile
  - Gemfile.lock
  - readme.md
  # legacy D3 / notebook pages from the previous portfolio (kept in git, not built)
  - profile_nswrent.html
  - profile_nswsold.html
  - profile_titanic.html
  - profile_titanic.py
  - property_hexbin.html
  - property_input.py
  - property_leaflet.html
  - surname_culture.html
  - tile_calendar.html
  - datafeed
  - map_util
  - tool_utils
  - resources
  - css
  # unused vendor CSS/JS from the previous template
  - assets/css/animated.css
  - assets/css/fontawesome.css
  - assets/css/owl.css
  - assets/css/templatemo-digimedia-v2.css
  - assets/js/animation.js
  - assets/js/owl-carousel.js
  - assets/culture_map.json
  - assets/culture_surname.json
  - assets/POA_2016_NSW_reduced.geojson
  - assets/SA4_2016_NSW_reduced.geojson
  - assets/world_countries.json
  - assets/ajax-loader.gif
